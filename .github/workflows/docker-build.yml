name: Linux Docker build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build production image (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the Cloud Run image without deploying
        run: docker build --pull --platform linux/amd64 --progress=plain --tag brewtify:ci .
