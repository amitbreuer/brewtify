name: Party checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test --workspace=@brewtify/spotify && npm test --workspace=api && npm run test:integration --workspace=api
      - run: npm run lint:party --workspace=mini-app && npm test --workspace=mini-app
